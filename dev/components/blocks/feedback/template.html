<div class="feed">
  <div class="container">
    <div class="feed__inner">
      <div class="feed__img">
        <img src="images/feedback.png" alt="" />
      </div>

      <div class="feed__info">
        <div class="modal__wrapper form">
          <div class="modal__title">Нужна консультация?</div>
          <div class="modal__text">
           Подробно расскажем о наших услугах, видах работ и типовых проектах, рассчитаем стоимость и подготовим индивидуальное предложение!
          </div>

          <form action="#">
            <div class="modal__fields">
              <label class="field error">
                <input type="text" placeholder="Имя" />
              </label>
           

              <label class="field">
                <input
                  type="text"
                  class="mask"
                  placeholder="Телефон"
                />
              </label>
              <label class="field">
                <input type="text" placeholder="Комментарий"/>
              </label>
            </div>

           

            <label class="checkbox">
              <span class="checkbox__inner">
                <input type="checkbox" />
                <span></span>
              </span>
              <span class="checkbox__text">
                Я даю свое согласие на обработку персональных данных, в
                соответствии с Федеральным законом от 27.07.2006 года №152-ФЗ «О
                персональных данных», на условиях и для целей, определенных в
                <a href="#">Согласии на обработку персональных данных </a>
              </span>
            </label>

            <button
              type="submit"
              class="feed__btn btn btn-blue"
              data-fancybox=""
              data-src="#thanks"
            >
              Оставить заявку
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
